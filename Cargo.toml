[workspace]
members = [
    "crates/luffy-core",
    "crates/luffy-engines",
    "crates/luffy-router",
    "crates/luffy-meter",
    "crates/luffy-panel",
    "crates/luffy-ui",
    "crates/luffy-cli",
    "crates/luffy-testkit",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Luffy Gateway Contributors"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sha2 = "0.10"
